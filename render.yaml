services:
  - type: web
    name: ecoguard-ghana
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # Firebase Auth UI (set in the Render dashboard BEFORE deploying):
      # - key: VITE_FIREBASE_API_KEY
      #   sync: false
      # - key: VITE_FIREBASE_AUTH_DOMAIN
      #   value: eco-guard-ghana.firebaseapp.com
      # - key: VITE_FIREBASE_PROJECT_ID
      #   value: eco-guard-ghana
      # - key: VITE_FIREBASE_STORAGE_BUCKET
      #   value: eco-guard-ghana.firebasestorage.app
      # - key: VITE_FIREBASE_MESSAGING_SENDER_ID
      #   sync: false
      # - key: VITE_FIREBASE_APP_ID
      #   sync: false
      # Optional: enforce sign-in on /api writes with a service-account key:
      # - key: FIREBASE_SERVICE_ACCOUNT
      #   sync: false
